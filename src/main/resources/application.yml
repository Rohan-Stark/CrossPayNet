spring:
  application:
    name: crosspaynet

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crosspaynet}
    username: ${SPRING_DATASOURCE_USERNAME:crosspaynet_user}
    password: ${SPRING_DATASOURCE_PASSWORD:crosspaynet_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Explicitly disable Hibernate automatic schema generation
    # Flyway is the authoritative schema evolution tool
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    # We will manage schemas in Flyway, default location is db/migration
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        retries: 3
    consumer:
      group-id: crosspaynet-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "com.crosspaynet.*"
        spring.json.use.type.headers: false

  modulith:
    events:
      kafka:
        enable-json: false
      republish-outstanding-events-on-restart: true
      jdbc:
        # Schema owning the event publication table
        schema: system
        # Explicitly disable Spring Modulith auto-schema initialization
        # since Flyway will own the creation of the system schema and table.
        schema-initialization:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    # Transient Kafka network interruptions must not cause destructive application restarts
    # The transactional outbox safely buffers events in PostgreSQL until Kafka reconnects
    kafka:
      enabled: false

crosspaynet:
  security:
    cors:
      allowed-origins: ${CROSSPAYNET_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    users:
      customer:
        username: ${CROSSPAYNET_CUSTOMER_USERNAME:customer}
        password: ${CROSSPAYNET_CUSTOMER_PASSWORD:customer123!}
      compliance:
        username: ${CROSSPAYNET_COMPLIANCE_USERNAME:compliance}
        password: ${CROSSPAYNET_COMPLIANCE_PASSWORD:compliance123!}
      operations:
        username: ${CROSSPAYNET_OPERATIONS_USERNAME:operations}
        password: ${CROSSPAYNET_OPERATIONS_PASSWORD:operations123!}
      admin:
        username: ${CROSSPAYNET_ADMIN_USERNAME:admin}
        password: ${CROSSPAYNET_ADMIN_PASSWORD:admin123!}
  demo-data:
    # Local development demo seed data (Checkpoint 10C)
    # Strictly disabled by default; enabled only under 'local' profile
    enabled: ${CROSSPAYNET_DEMO_DATA_ENABLED:false}
  operations:
    reconciliation:
      scheduling:
        # Scheduled periodic reconciliation scans (Phase 9B Checkpoint 2)
        # Strictly disabled by default; set to true to enable with ShedLock multi-instance protection
        enabled: ${CROSSPAYNET_OPERATIONS_RECONCILIATION_SCHEDULING_ENABLED:false}
        cron: ${CROSSPAYNET_OPERATIONS_RECONCILIATION_SCHEDULING_CRON:0 */15 * * * *}
        lock-at-most-for: ${CROSSPAYNET_OPERATIONS_RECONCILIATION_SCHEDULING_LOCK_AT_MOST_FOR:30m}
        lock-at-least-for: ${CROSSPAYNET_OPERATIONS_RECONCILIATION_SCHEDULING_LOCK_AT_LEAST_FOR:5m}
