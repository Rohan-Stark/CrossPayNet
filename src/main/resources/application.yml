spring:
  application:
    name: crosspaynet

  datasource:
    url: jdbc:postgresql://localhost:5432/crosspaynet
    username: crosspaynet_user
    password: crosspaynet_password
    driver-class-name: org.postgresql.Driver

  jpa:
    # Explicitly disable Hibernate automatic schema generation
    # Flyway is the authoritative schema evolution tool
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # We will manage schemas in Flyway, default location is db/migration
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        retries: 3
    consumer:
      group-id: crosspaynet-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "com.crosspaynet.*"
        spring.json.use.type.headers: false

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        # Schema owning the event publication table
        schema: system
        # Explicitly disable Spring Modulith auto-schema initialization
        # since Flyway will own the creation of the system schema and table.
        schema-initialization:
          enabled: false

crosspaynet:
  security:
    users:
      customer:
        username: ${CROSSPAYNET_CUSTOMER_USERNAME:customer}
        password: ${CROSSPAYNET_CUSTOMER_PASSWORD:customer123!}
      compliance:
        username: ${CROSSPAYNET_COMPLIANCE_USERNAME:compliance}
        password: ${CROSSPAYNET_COMPLIANCE_PASSWORD:compliance123!}
      operations:
        username: ${CROSSPAYNET_OPERATIONS_USERNAME:operations}
        password: ${CROSSPAYNET_OPERATIONS_PASSWORD:operations123!}
      admin:
        username: ${CROSSPAYNET_ADMIN_USERNAME:admin}
        password: ${CROSSPAYNET_ADMIN_PASSWORD:admin123!}
